:root{--bg:#F1F4F0;--card:#fff;--ink:#101410;--dark:#111511;--dark2:#1C221C;--lime:#5FC422;--lime2:#7EE03C;--limeSoft:#E4F6D8;--muted:#7A847A;--line:#E6EAE5;--inc:#2FA84F;--exp:#E5484D;--r:24px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Vaz,system-ui,sans-serif;font-size:15px;-webkit-text-size-adjust:100%}
body{overscroll-behavior-y:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,select,textarea{font:inherit;color:var(--ink)}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
#view{padding:calc(env(safe-area-inset-top) + 12px) 16px calc(env(safe-area-inset-bottom) + 104px);max-width:560px;margin:0 auto}
.col{display:flex;flex-direction:column;gap:16px}
.row{display:flex;align-items:center;gap:10px}
.grow{flex:1;min-width:0}
.muted{color:var(--muted)}
.panel{background:var(--card);border-radius:var(--r);padding:16px}
.h1{font-size:26px;font-weight:800;margin:0}
.h2{font-size:18px;font-weight:700;margin:0}
.sm{font-size:12px}.xs{font-size:11px}
.b{font-weight:700}.xb{font-weight:800}
.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top{display:flex;align-items:center;gap:12px}
.logo{width:48px;height:48px;border-radius:15px;object-fit:cover}
.sq{width:46px;height:46px;border-radius:15px;background:#fff;display:grid;place-items:center;box-shadow:0 3px 10px rgba(0,0,0,.05)}
.link{color:var(--lime);font-weight:600;font-size:13px}
/* hero */
.hero{position:relative;overflow:hidden;background:var(--dark);color:#fff;border-radius:28px;padding:20px}
.hero::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 100% 0%,rgba(95,196,34,.5),transparent 60%);pointer-events:none}
.hero>*{position:relative}
.dot{width:8px;height:8px;border-radius:50%;background:var(--lime2);display:inline-block}
.pillbadge{background:var(--lime2);color:var(--ink);font-weight:700;font-size:12px;padding:4px 10px;border-radius:99px}
.big{font-size:32px;font-weight:800;line-height:1.2}
.hpill{flex:1;display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.08);border-radius:16px;padding:10px;min-width:0}
.hpill .ic{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;color:var(--dark);flex:none}
.hpill .ic svg{width:14px;height:14px;stroke-width:3}
/* bank card */
.hscroll{display:flex;gap:12px;overflow-x:auto;margin:0 -16px;padding:2px 16px;scrollbar-width:none;scroll-snap-type:x mandatory}
.hscroll::-webkit-scrollbar{display:none}
.bcard{position:relative;overflow:hidden;flex:none;width:280px;height:168px;border-radius:24px;padding:18px;color:#fff;display:flex;flex-direction:column;scroll-snap-align:start}
.bcard::before,.bcard::after{content:"";position:absolute;border-radius:50%;background:rgba(255,255,255,.08)}
.bcard::before{width:190px;height:190px;left:-60px;top:-90px}
.bcard::after{width:130px;height:130px;right:-50px;bottom:-60px;background:rgba(255,255,255,.06)}
.bcard>*{position:relative}
.bcard .num{direction:ltr;unicode-bidi:isolate;font-weight:600;font-size:13px;opacity:.9}
.addcard{flex:none;width:130px;height:168px;border-radius:24px;border:1.5px dashed rgba(122,132,122,.5);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;font-weight:600;font-size:13px;scroll-snap-align:start}
.addcard .pl{width:44px;height:44px;border-radius:50%;background:var(--limeSoft);display:grid;place-items:center}
/* tiles */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{background:#fff;border-radius:22px;padding:14px;min-width:0}
.badge{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;flex:none;font-size:18px}
.badge svg{width:16px;height:16px;stroke-width:2.6}
.spark{width:100%;height:36px;display:block;margin-top:6px}
/* list rows */
.tx{display:flex;align-items:center;gap:12px;padding:9px 0;width:100%;text-align:start}
.tx+.tx{border-top:1px solid var(--line)}
.tx .badge{width:44px;height:44px;border-radius:14px;font-size:21px}
.amt{display:flex;align-items:center;gap:3px;font-weight:700;justify-content:flex-end}
.amt svg{width:11px;height:11px;stroke-width:3}
.inc{color:var(--inc)}.exp{color:var(--exp)}
.dayhead{display:flex;justify-content:space-between;font-size:13px;font-weight:600;color:var(--muted);padding:4px 6px}
/* chips & segmented */
.chips{display:flex;gap:8px}
.chip{flex:1;height:40px;border-radius:12px;background:var(--bg);font-size:13px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:6px;padding:0 10px;white-space:nowrap}
.chip.on{background:var(--ink);color:#fff}
.chipwrap{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:8px}
.seg{display:flex;background:#fff;border-radius:99px;padding:4px;gap:4px}
.seg button{flex:1;height:42px;border-radius:99px;font-weight:700;color:var(--muted);display:flex;align-items:center;justify-content:center;gap:6px;transition:.2s}
.seg button svg{width:13px;height:13px;stroke-width:3}
.seg button.on.e{background:var(--ink);color:#fff}
.seg button.on.i{background:var(--lime);color:#fff}
.seg.gray{background:var(--bg)}
.month{display:flex;align-items:center;justify-content:space-between;background:#fff;border-radius:99px;padding:8px}
.month .nb{width:40px;height:40px;border-radius:50%;background:var(--bg);display:grid;place-items:center}
.month .nb svg{width:16px;height:16px;stroke-width:3}
.search{display:flex;align-items:center;gap:8px;background:#fff;border-radius:16px;padding:0 14px;height:46px;color:var(--muted)}
.search input{border:0;outline:0;background:none;flex:1;font-size:16px}
.bar{height:6px;background:var(--bg);border-radius:9px;overflow:hidden}
.bar>i{display:block;height:100%;border-radius:9px}
.empty{text-align:center;padding:24px 8px}
.empty .ei{width:64px;height:64px;border-radius:50%;background:var(--limeSoft);color:var(--lime);display:grid;place-items:center;margin:0 auto 8px;font-size:28px}
/* buttons */
.primary{width:100%;height:56px;border-radius:99px;background:var(--ink);color:#fff;font-weight:700;font-size:16px;display:flex;align-items:center;justify-content:center;gap:8px}
.primary:active{opacity:.85;transform:scale(.99)}
.primary[disabled]{opacity:.4}
.primary.lime{background:var(--lime)}
.danger{width:100%;padding:12px;color:var(--exp);font-weight:600}
.mini{display:inline-flex;align-items:center;gap:6px;background:var(--limeSoft);border-radius:99px;padding:7px 12px;font-size:13px;font-weight:600}
.mini svg{width:14px;height:14px;stroke-width:2.6}
/* tab bar */
#tabs{position:fixed;left:0;right:0;bottom:0;background:#fff;border-radius:26px 26px 0 0;box-shadow:0 -4px 18px rgba(0,0,0,.07);display:flex;align-items:flex-start;padding:8px 8px calc(env(safe-area-inset-bottom) + 4px);z-index:5}
#tabs .t{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;height:50px;justify-content:center;color:rgba(122,132,122,.85);font-size:11px;font-weight:500}
#tabs .t.on{color:var(--ink);font-weight:700}
#tabs .t svg{width:22px;height:22px}
#tabs .fab{flex:1;display:flex;justify-content:center}
#tabs .fab button{width:62px;height:62px;margin-top:-26px;border-radius:50%;background:linear-gradient(var(--lime2),var(--lime));color:#fff;display:grid;place-items:center;border:5px solid var(--limeSoft);box-shadow:0 6px 14px rgba(95,196,34,.45)}
#tabs .fab svg{width:26px;height:26px;stroke-width:3}
/* sheet */
#sheet{position:fixed;inset:0;z-index:20;display:none}
#sheet.open{display:block}
#sheet .bd{position:absolute;inset:0;background:rgba(10,14,10,.35);opacity:0;transition:opacity .25s}
#sheet.show .bd{opacity:1}
#sheet .sh{position:absolute;left:0;right:0;bottom:0;max-height:92vh;max-height:92dvh;background:var(--bg);border-radius:28px 28px 0 0;transform:translateY(100%);transition:transform .3s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;max-width:560px;margin:0 auto}
#sheet.show .sh{transform:none}
#sheet .shh{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 8px}
#sheet .shb{overflow-y:auto;padding:4px 16px calc(env(safe-area-inset-bottom) + 20px);-webkit-overflow-scrolling:touch}
.grab{width:40px;height:5px;border-radius:9px;background:#cfd6ce;margin:8px auto 0}
.field{background:#fff;border-radius:20px;padding:14px;display:flex;flex-direction:column;gap:10px}
.field>label{font-size:13px;font-weight:500;color:var(--muted)}
.inp{border:0;outline:0;background:none;width:100%;font-size:16px;font-weight:600;padding:2px 0}
textarea.inp{resize:none;font-weight:400;min-height:44px}
.amtbig{font-size:34px;font-weight:800;text-align:center}
.dp{display:flex;gap:8px}
.dp select{flex:1;height:46px;border-radius:12px;border:0;background:var(--bg);padding:0 10px;font-size:16px;font-weight:600;-webkit-appearance:none;appearance:none;text-align:center;text-align-last:center}
.sel{height:46px;border-radius:12px;border:0;background:var(--bg);padding:0 12px;font-size:16px;font-weight:600;width:100%;-webkit-appearance:none;appearance:none}
.swatches{display:flex;flex-wrap:wrap;gap:10px}
.sw{width:34px;height:34px;border-radius:50%;outline-offset:3px}
.sw.on{outline:3px solid var(--ink)}
.emojis{display:grid;grid-template-columns:repeat(8,1fr);gap:6px}
.emojis button{aspect-ratio:1;border-radius:12px;background:var(--bg);font-size:20px}
.emojis button.on{background:var(--ink)}
.toggle{display:flex;align-items:center;justify-content:space-between;font-weight:600}
.sugg{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.sugg::-webkit-scrollbar{display:none}
.sugg button{flex:none;background:var(--bg);border-radius:99px;padding:6px 10px;font-size:12px;font-weight:500}
/* stats */
.donut{position:relative;width:220px;height:220px;margin:0 auto}
.donut .c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.bars{display:flex;align-items:flex-end;gap:10px;height:170px;padding-top:10px}
.bars .m{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%}
.bars .pair{flex:1;display:flex;align-items:flex-end;gap:3px;width:100%;justify-content:center}
.bars .pair i{width:40%;max-width:16px;border-radius:5px 5px 2px 2px;min-height:2px}
.legend{display:flex;gap:14px;font-size:12px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend b{width:10px;height:10px;border-radius:3px;display:inline-block}
.sumtiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.sumtiles .tile{border-radius:18px;padding:12px}
/* projects */
.ptable{width:100%;border-collapse:separate;border-spacing:0 3px;font-size:13px}
.ptable th{background:var(--dark);color:#fff;font-weight:700;font-size:12px;padding:10px 8px;text-align:start}
.ptable th:first-child{border-radius:0 12px 12px 0}.ptable th:last-child{border-radius:12px 0 0 12px;text-align:end}
.ptable td{padding:10px 8px;vertical-align:middle}
.ptable td:last-child{text-align:end;font-weight:700;white-space:nowrap}
.ptable tr.z td{background:rgba(241,244,240,.75)}
.ptable tr.z td:first-child{border-radius:0 10px 10px 0}.ptable tr.z td:last-child{border-radius:10px 0 0 10px}
.ptable tbody tr{cursor:pointer}
.total{display:flex;justify-content:space-between;align-items:center;background:var(--limeSoft);border-radius:12px;padding:12px;margin-top:8px}
.formula{display:flex;align-items:center;gap:6px}
.formula .fc{flex:1;text-align:center;background:var(--bg);border-radius:14px;padding:10px 4px;min-width:0}
.formula .fc.k{background:var(--ink);color:#fff}
.formula .op{font-size:20px;font-weight:700;color:var(--muted)}
.ghero{background:#fff;border-radius:28px;padding:26px 16px;text-align:center}
.datepill{display:inline-flex;align-items:center;gap:6px;background:var(--bg);border-radius:99px;padding:8px 14px;font-size:13px;font-weight:600}
.datepill svg{width:16px;height:16px}
.status{font-size:11px;font-weight:700;padding:4px 10px;border-radius:99px;flex:none}
.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.iconbtn{width:40px;height:40px;border-radius:50%;background:#fff;display:grid;place-items:center}
.iconbtn svg{width:18px;height:18px}
.navbar{display:flex;align-items:center;gap:10px}
.install{background:var(--ink);color:#fff;border-radius:22px;padding:14px;font-size:13px;line-height:1.8}
.install b{color:var(--lime2)}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 100px);transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:10px 18px;border-radius:99px;font-size:13px;font-weight:600;opacity:0;transition:.25s;z-index:30;pointer-events:none;white-space:nowrap}
#toast.on{opacity:1;transform:translateX(-50%)}
#print{display:none}
@media print{
  body>*:not(#print){display:none!important}
  #print{display:block;padding:24px;background:#fff}
  .ptable th{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .total,.ptable tr.z td{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
</head>
<body>
<main id="view"></main>
<nav id="tabs"></nav>
<div id="sheet"><div class="bd" data-act="sheet-close"></div><div class="sh"><div class="grab"></div><div class="shh"><span class="h2" id="shTitle"></span><button class="iconbtn" data-act="sheet-close" style="background:#fff"></button></div><div class="shb" id="shBody"></div></div></div>
<div id="toast"></div>
<div id="print"></div>
<input type="file" id="importFile" accept="application/json,.json" hidden>

const VERSION = "1.0";

/* ---------- Jalali calendar ---------- */
const div=(a,b)=>~~(a/b),mod=(a,b)=>a-~~(a/b)*b;
const BR=[-61,9,38,199,426,686,756,818,1111,1181,1210,1635,2060,2097,2192,2262,2324,2394,2456,3178];
function jalCal(jy){let bl=BR.length,gy=jy+621,leapJ=-14,jp=BR[0],jm,jump=0,leap,leapG,march,n,i;for(i=1;i<bl;i++){jm=BR[i];jump=jm-jp;if(jy<jm)break;leapJ+=div(jump,33)*8+div(mod(jump,33),4);jp=jm}n=jy-jp;leapJ+=div(n,33)*8+div(mod(n,33)+3,4);if(mod(jump,33)===4&&jump-n===4)leapJ++;leapG=div(gy,4)-div((div(gy,100)+1)*3,4)-150;march=20+leapJ-leapG;if(jump-n<6)n=n-jump+div(jump+4,33)*33;leap=mod(mod(n+1,33)-1,4);if(leap===-1)leap=4;return{leap,gy,march}}
function g2d(gy,gm,gd){let d=div((gy+div(gm-8,6)+100100)*1461,4)+div(153*mod(gm+9,12)+2,5)+gd-34840408;return d-div(div(gy+100100+div(gm-8,6),100)*3,4)+752}
function d2g(jdn){let j=4*jdn+139361631;j=j+div(div(4*jdn+183187720,146097)*3,4)*4-3908;const i=div(mod(j,1461),4)*5+308;const gd=div(mod(i,153),5)+1,gm=mod(div(i,153),12)+1,gy=div(j,1461)-100100+div(8-gm,6);return{gy,gm,gd}}
function j2d(jy,jm,jd){const r=jalCal(jy);return g2d(r.gy,3,r.march)+(jm-1)*31-div(jm,7)*(jm-7)+jd-1}
function d2j(jdn){const gy=d2g(jdn).gy;let jy=gy-621;const r=jalCal(jy),f=g2d(gy,3,r.march);let k=jdn-f,jm,jd;if(k>=0){if(k<=185){jm=1+div(k,31);jd=mod(k,31)+1;return{jy,jm,jd}}k-=186}else{jy--;k+=179;if(r.leap===1)k++}jm=7+div(k,30);jd=mod(k,30)+1;return{jy,jm,jd}}
const MONTHS=["فروردین","اردیبهشت","خرداد","تیر","مرداد","شهریور","مهر","آبان","آذر","دی","بهمن","اسفند"];
const WEEK=["یکشنبه","دوشنبه","سه‌شنبه","چهارشنبه","پنجشنبه","جمعه","شنبه"];
const pad=n=>String(n).padStart(2,"0");
function today(){const d=new Date();return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())}
function addDays(s,n){const [y,m,d]=s.split("-").map(Number);const x=new Date(y,m-1,d+n);return x.getFullYear()+"-"+pad(x.getMonth()+1)+"-"+pad(x.getDate())}
function toJ(s){const [y,m,d]=s.split("-").map(Number);return d2j(g2d(y,m,d))}
function toG(jy,jm,jd){const g=d2g(j2d(jy,jm,jd));return g.gy+"-"+pad(g.gm)+"-"+pad(g.gd)}
function monthLen(jy,jm){return jm<=6?31:jm<=11?30:(jalCal(jy).leap===0?30:29)}
function jLong(s){const j=toJ(s);return j.jd+" "+MONTHS[j.jm-1]+" "+j.jy}
function jShort(s){const j=toJ(s);return j.jy+"/"+pad(j.jm)+"/"+pad(j.jd)}
function jWeek(s){const [y,m,d]=s.split("-").map(Number);const j=toJ(s);return WEEK[new Date(y,m-1,d).getDay()]+" "+j.jd+" "+MONTHS[j.jm-1]}
const mKey=s=>{const j=toJ(s);return j.jy*100+j.jm};
const curMonth=()=>{const j=toJ(today());return{jy:j.jy,jm:j.jm}};
function mAdd(m,n){let t=m.jy*12+(m.jm-1)+n;return{jy:Math.floor(t/12),jm:t%12+1}}
const mTitle=m=>MONTHS[m.jm-1]+" "+m.jy;

function money(v){v=Math.round(v||0);const s=Math.abs(v).toLocaleString("en-US").replace(/,/g,"٬");return v<0?"−"+s:s}
const toman=v=>money(v)+" تومان";
function dec(v){return (Math.round(v*10)/10).toLocaleString("en-US",{maximumFractionDigits:1})}
function compact(v){const a=Math.abs(v);if(a>=1e9)return dec(v/1e9)+" میلیارد";if(a>=1e6)return dec(v/1e6)+" میلیون";if(a>=1e3)return dec(v/1e3)+" هزار";return money(v)}
const pct=v=>(isFinite(v)?dec(v):"0")+"٪";
const latin=s=>String(s).replace(/[۰-۹]/g,c=>"۰۱۲۳۴۵۶۷۸۹".indexOf(c)).replace(/[٠-٩]/g,c=>"٠١٢٣٤٥٦٧٨٩".indexOf(c));
const digits=s=>latin(s).replace(/\D/g,"");
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function cardNum(n,mask){const d=digits(n||"");if(!d)return"•••• •••• •••• ••••";const g=d.match(/.{1,4}/g);if(mask&&g.length===4){g[1]="••••";g[2]="••••"}return g.join(" ")}

function ring(p,label){const C=2*Math.PI*36,v=Math.max(0,Math.min(1,p));

  <div class="sumtiles"><div class="tile"><div class="sm muted">درآمد</div><div class="xb ell inc">${compact(inc)}</div></div><div class="tile"><div class="sm muted">هزینه</div><div class="xb ell exp">${compact(exp)}</div></div><div class="tile"><div class="sm muted">مانده</div><div class="xb ell" style="color:${inc-exp>=0?"var(--ink)":"var(--exp)"}">${compact(inc-exp)}</div></div></div>
  <div class="panel col">${seg(k,"stat-kind")}${sl.length?donut:empty("📊","داده‌ای برای "+mTitle(R.month)+" نیست","وقتی "+(k==="expense"?"هزینه":"درآمد")+" ثبت کنی، اینجا به تفکیک دسته نشون داده می‌شه")}</div>
  ${sl.length?`<div class="panel col" style="gap:14px"><h2 class="h2" style="font-size:17px">ریز ${k==="expense"?"هزینه‌ها":"درآمدها"} در ${MONTHS[R.month.jm-1]}</h2>
  ${sl.map(s=>`<div class="col" style="gap:8px"><div class="row">${badge(s.c?s.c.icon:"❔",col(s),38)}<div class="grow"><div class="b">${esc(s.c?s.c.name:"بدون دسته")}</div><div class="xs muted">${s.n} تراکنش</div></div><div style="text-align:end"><div class="b">${money(s.v)}</div><div class="xs b" style="color:${col(s)}">${pct(s.v/total*100)}</div></div></div><div class="bar"><i style="width:${s.v/top*100}%;background:${col(s)}"></i></div></div>`).join("")}</div>`:""}
  <div class="panel col" style="gap:10px"><div class="row"><h2 class="h2 grow" style="font-size:17px">روند ۶ ماه</h2><div class="legend"><span><b style="background:var(--inc)"></b>درآمد</span><span><b style="background:var(--exp)"></b>هزینه</span></div></div>
  <div class="bars">${months.map(x=>`<div class="m"><div class="pair"><i style="height:${x.i/mx*100}%;background:var(--inc)"></i><i style="height:${x.e/mx*100}%;background:var(--exp)"></i></div><span class="xs muted">${MONTHS[x.m.jm-1]}</span></div>`).join("")}</div>
  <div class="xs muted">بیشترین مقدار: ${compact(mx)} تومان</div></div></div>`}

function vProjects(){
  const f=R.pFilter,list=D.projects.filter(p=>f==="all"||(f==="done"?p.done:!p.done)).sort((a,b)=>a.date<b.date?1:-1);
  const rec=list.reduce((a,p)=>a+p.received,0),sp=list.reduce((a,p)=>a+pExp(p),0),pr=rec-sp;
  const names={active:"در جریان",done:"تمام‌شده",all:"همه"};
  return `<div class="col"><div class="row"><h1 class="h1 grow">پروژه‌ها</h1><button class="iconbtn" style="background:var(--ink);color:#fff" data-act="proj-new">${ic("plus","stroke-width:3")}</button></div>
  <section class="hero col"><div class="row"><span class="row grow" style="gap:6px"><i class="dot"></i><span style="opacity:.75">سود خالص · ${names[f]}</span></span><span class="pillbadge">${list.length} پروژه</span></div>
  <div class="row"><div class="grow"><div class="big ell" style="color:${pr>=0?"#fff":"#FF8080"}">${money(pr)}</div><div class="sm" style="opacity:.6">تومان سود باقی‌مانده</div></div>${ring(rec>0?Math.max(pr,0)/rec:0,"حاشیه سود")}</div>
  <div class="row"><div class="hpill"><span class="ic" style="background:var(--lime2)">${ic("inc")}</span><div class="grow"><div class="xs" style="opacity:.6">دریافتی</div><div class="b ell">${money(rec)}</div></div></div><div class="hpill"><span class="ic" style="background:#FF8080">${ic("exp")}</span><div class="grow"><div class="xs" style="opacity:.6">هزینه‌ها</div><div class="b ell">${money(sp)}</div></div></div></div></section>
  <div class="chips panel" style="padding:6px;border-radius:16px">${Object.keys(names).map(k=>`<button class="chip ${f===k?"on":""}" data-act="pfilter" data-f="${k}">${names[k]}</button>`).join("")}</div>
  ${list.length?list.map(pCard).join(""):`<div class="panel col">${empty("💼","پروژه‌ای اینجا نیست","پروژه بساز، مبلغی که گرفتی رو ثبت کن و خرج‌هاش رو اضافه کن تا سود نهایی رو ببینی")}<button class="primary lime" data-act="proj-new">ساخت پروژه جدید</button></div>`}</div>`}
function pCard(p){const e=pExp(p),pr=p.received-e,ratio=p.received>0?e/p.received:(e>0?1:0);
  const m=(t,v,c)=>`<div class="grow"><div class="xs muted">${t}</div><div class="b ell" style="color:${c}">${compact(v)}</div></div>`;
  return `<button class="panel col" style="text-align:start;gap:14px;width:100%" data-act="go" data-v="project" data-id="${p.id}">
  <div class="row">${badge("💼","#5FC422",44)}<div class="grow"><div class="b ell" style="font-size:16px">${esc(p.title)}</div><div class="sm muted ell">${esc(p.client?p.client+" · ":"")}${jLong(p.date)}</div></div><span class="status" style="background:${p.done?"var(--bg)":"var(--limeSoft)"};color:${p.done?"var(--muted)":"var(--lime)"}">${p.done?"تمام‌شده":"در جریان"}</span></div>
  <div class="row">${m("دریافتی",p.received,"var(--ink)")}${m("هزینه",e,"var(--exp)")}${m("سود",pr,pr>=0?"var(--inc)":"var(--exp)")}</div>
  <div class="col" style="gap:6px"><div class="bar"><i style="width:${Math.min(ratio,1)*100}%;background:${ratio>1?"var(--exp)":"var(--lime)"}"></i></div><div class="xs muted">${pct(Math.round(ratio*100))} از مبلغ پروژه خرج شده</div></div></button>`}

function expTable(p,printing){const items=p.expenses.slice().sort((a,b)=>a.date===b.date?a.created-b.created:(a.date<b.date?-1:1));
  return `<table class="ptable"><thead><tr><th style="width:26px">#</th><th>شرح</th><th style="width:78px">تاریخ</th><th>مبلغ (تومان)</th></tr></thead><tbody>
  ${items.length?items.map((e,i)=>`<tr class="${i%2?"z":""}" ${printing?"":`data-act="exp-edit" data-pid="${p.id}" data-id="${e.id}"`}><td class="muted">${i+1}</td><td><div style="font-weight:600">${esc(e.title)}</div>${e.note?`<div class="xs muted">${esc(e.note)}</div>`:""}</td><td class="sm muted">${jShort(e.date)}</td><td>${money(e.amount)}</td></tr>`).join(""):`<tr><td colspan="4" class="muted sm" style="text-align:center;padding:22px">هنوز هزینه‌ای برای این پروژه ثبت نشده</td></tr>`}
  </tbody></table><div class="total"><span class="b">جمع هزینه‌ها</span><span class="xb">${toman(pExp(p))}</span></div>`}

function vProject(id){const p=byId(D.projects,id);if(!p)return goBackRender();
  const e=pExp(p),pr=p.received-e,mg=pMargin(p);
  const ml=mg>=60?"عالی":mg>=30?"خوب":mg>=0?"کم":"زیان‌ده",mc=mg>=30?"var(--inc)":mg>=0?"#E2A23B":"var(--exp)";
  const tile=(t,v,i,s,sc)=>`<div class="tile col" style="gap:6px"><div class="row"><span class="sm muted grow" style="font-weight:500">${t}</span><span class="iconbtn" style="width:34px;height:34px;border-radius:11px;background:var(--bg);font-size:15px">${i}</span></div><div class="xb ell" style="font-size:20px">${v}</div><div class="xs b ell" style="color:${sc}">${s}</div></div>`;
  return `<div class="col" style="gap:14px">${backbar(p.title,`<button class="iconbtn" data-act="proj-edit" data-id="${p.id}">${ic("edit")}</button>`)}
  <div class="ghero"><div class="muted" style="font-weight:500">سود نهایی پروژه</div><div class="xb ell" style="font-size:40px;color:${pr>=0?"var(--ink)":"var(--exp)"}">${money(pr)}</div><div class="sm muted" style="margin-bottom:10px">تومان</div><span class="datepill">${ic("cal")}${jLong(p.date)}</span></div>
  <div class="pgrid">${tile("مبلغ دریافتی",money(p.received),"📥","تومان","var(--muted)")}${tile("مجموع هزینه‌ها",money(e),"🛒","تومان","var(--muted)")}${tile("حاشیه سود",pct(mg),"📈",ml,mc)}${tile("اقلام هزینه",p.expenses.length,"🧾",esc(p.client||"کارفرما ثبت نشده"),"var(--lime)")}</div>
  <div class="panel"><div class="row" style="margin-bottom:12px"><h2 class="h2 grow" style="font-size:17px">جدول هزینه‌ها</h2><button class="mini" data-act="exp-new" data-pid="${p.id}">${ic("plus")}افزودن هزینه</button></div>${expTable(p)}${p.expenses.length?`<div class="xs muted" style="margin-top:8px;text-align:center">برای ویرایش یا حذف روی هر ردیف بزن</div>`:""}</div>
  <div class="panel col" style="gap:12px"><h2 class="h2" style="font-size:17px">محاسبه سود</h2><div class="formula"><div class="fc"><div class="xs muted">دریافتی</div><div class="xb ell sm">${compact(p.received)}</div></div><span class="op">−</span><div class="fc"><div class="xs muted">هزینه‌ها</div><div class="xb ell sm exp">${compact(e)}</div></div><span class="op">=</span><div class="fc k"><div class="xs" style="opacity:.7">سود</div><div class="xb ell sm">${compact(pr)}</div></div></div>${p.note?`<div class="sm muted">${esc(p.note)}</div>`:""}</div>
  <button class="primary" data-act="print" data-id="${p.id}">${ic("share")}خروجی فاکتور (PDF)</button>
  <button class="primary" style="background:#fff;color:var(--ink)" data-act="proj-done" data-id="${p.id}">${ic(p.done?"undo":"check")}${p.done?"برگرداندن به «در جریان»":"علامت‌گذاری به‌عنوان تمام‌شده"}</button>
  <button class="danger" data-act="proj-del" data-id="${p.id}">حذف پروژه</button></div>`}

function vSettings(){
  return `<div class="col">${backbar("تنظیمات")}
  <div class="panel row" style="gap:14px"><img class="logo" style="width:64px;height:64px;border-radius:18px" src="${LOGO}" alt=""><div><div class="xb" style="font-size:20px">Pantera</div><div class="sm muted">حسابداری شخصی · نسخه ${VERSION}</div></div></div>
  <div class="panel" style="padding:6px 14px">
    <button class="tx" data-act="go" data-v="cards">${badge(ic("card"),"#2F80ED",36)}<span class="grow b">کارت‌های بانکی</span><span class="sm muted">${D.cards.length} کارت</span>${ic("chevL","width:16px;color:var(--muted)")}</button>
    <button class="tx" data-act="go" data-v="cats">${badge(ic("grid"),"#F2994A",36)}<span class="grow b">دسته‌بندی‌ها</span><span class="sm muted">${D.cats.length} دسته</span>${ic("chevL","width:16px;color:var(--muted)")}</button></div>
  <div class="panel col" style="gap:10px"><h2 class="h2" style="font-size:16px">پشتیبان‌گیری</h2><div class="sm muted">اطلاعات فقط روی همین گوشی ذخیره می‌شود. هر چند وقت یک بار فایل پشتیبان بگیر و در Files یا تلگرام نگه دار.</div>
    <button class="primary" data-act="export">${ic("down")}گرفتن فایل پشتیبان</button><button class="primary" style="background:var(--bg);color:var(--ink)" data-act="import">${ic("up")}بازگردانی از فایل پشتیبان</button></div>
  <div class="panel row">${badge(ic("lock"),"#5FC422",36)}<div class="sm grow">هیچ اطلاعاتی به سرور فرستاده نمی‌شود؛ همه‌چیز روی گوشی خودت است.</div></div>
  <button class="danger" data-act="reset">پاک کردن همه اطلاعات</button></div>`}
function vCards(){
  return `<div class="col">${backbar("کارت‌های بانکی",`<button class="iconbtn" data-act="card-new">${ic("plus")}</button>`)}
  ${D.cards.length?D.cards.map(c=>bcard(c,{style:"width:100%;height:190px",attr:`data-act="go" data-v="card" data-id="${c.id}"`})).join(""):`<div class="panel">${empty("💳","کارتی ثبت نشده","کارت بانکیت رو با موجودی فعلیش اضافه کن")}</div>`}
  <button class="primary" data-act="card-new">${ic("plus")}افزودن کارت</button></div>`}
function vCard(id){const c=cardOf(id);if(!c)return goBackRender();
  const list=sortTx(D.txns.filter(t=>t.cardId===id));
  return `<div class="col">${backbar(c.name||c.bank||"کارت",`<button class="iconbtn" data-act="card-edit" data-id="${id}">${ic("edit")}</button>`)}
  ${bcard(c,{style:"width:100%;height:200px"})}
  <div class="sumtiles"><div class="tile"><div class="xs muted">موجودی اولیه</div><div class="xb ell">${compact(c.initial)}</div></div><div class="tile"><div class="xs muted">واریزی</div><div class="xb ell inc">${compact(sumKind(list,"income"))}</div></div><div class="tile"><div class="xs muted">برداشتی</div><div class="xb ell exp">${compact(sumKind(list,"expense"))}</div></div></div>
  <div class="panel" style="padding:8px 14px"><h2 class="h2" style="font-size:17px;padding:6px 0">گردش حساب</h2>${list.length?list.map(txRow).join(""):empty("🧾","تراکنشی روی این کارت نیست")}</div></div>`}
function vCats(){const list=D.cats.filter(c=>c.kind===R.catKind).sort((a,b)=>a.order-b.order);
  return `<div class="col">${backbar("دسته‌بندی‌ها",`<button class="iconbtn" data-act="cat-new">${ic("plus")}</button>`)}${seg(R.catKind,"cat-kind")}
  <div class="panel" style="padding:6px 14px">${list.map(c=>`<button class="tx" data-act="cat-edit" data-id="${c.id}">${badge(c.icon,PALETTE[c.color%10],40)}<span class="grow b">${esc(c.name)}</span><span class="xs muted">${D.txns.filter(t=>t.catId===c.id).length} تراکنش</span></button>`).join("")||empty("🏷️","دسته‌ای نیست")}</div>
  <button class="primary" data-act="cat-new">${ic("plus")}دسته جدید</button></div>`}

function goBackRender(){R.stack.pop();return renderView()}
function renderView(){const top=R.stack[R.stack.length-1];
  if(top){if(top.v==="settings")return vSettings();if(top.v==="cards")return vCards();if(top.v==="card")return vCard(top.id);if(top.v==="cats")return vCats();if(top.v==="project")return vProject(top.id)}
  return {home:vHome,txns:vTxns,stats:vStats,projects:vProjects}[R.tab]()}
function render(scrollTop){$("#view").innerHTML=renderView();renderTabs();if(scrollTop)window.scrollTo(0,0)}
function renderTabs(){const t=(k,n,l)=>`<button class="t ${R.tab===k&&!R.stack.length?"on":""}" data-act="tab" data-t="${k}">${ic(n)}<span>${l}</span></button>`;
  $("#tabs").innerHTML=t("home","home","خانه")+t("txns","list","تراکنش‌ها")+`<div class="fab"><button data-act="add" aria-label="تراکنش جدید">${ic("plus")}</button></div>`+t("stats","pie","آمار")+t("projects","brief","پروژه‌ها")}

/* ---------- Sheet & forms ---------- */
let F=null; // {type,id,d}
function openSheet(type,id,d){F={type,id,d};$("#sheet").classList.add("open");renderSheet();requestAnimationFrame(()=>requestAnimationFrame(()=>$("#sheet").classList.add("show")));$(".shb").scrollTop=0}
function closeSheet(){const s=$("#sheet");s.classList.remove("show");setTimeout(()=>{s.classList.remove("open");F=null},280)}
function amountField(field,big){const v=F.d[field];return `<input class="inp ${big?"amtbig":""}" inputmode="numeric" autocomplete="off" placeholder="۰" data-amt="${field}" value="${v?money(v):""}">`}
function textField(field,ph,area){const v=esc(F.d[field]||"");return area?`<textarea class="inp" rows="2" data-f="${field}" placeholder="${ph}">${v}</textarea>`:`<input class="inp" data-f="${field}" placeholder="${ph}" value="${v}">`}
function datePicker(field){const j=toJ(F.d[field]),yNow=toJ(today()).jy,ml=monthLen(j.jy,j.jm);let d="",m="",y="";
  for(let i=1;i<=ml;i++)d+=`<option value="${i}" ${i===j.jd?"selected":""}>${i}</option>`;
  MONTHS.forEach((n,i)=>m+=`<option value="${i+1}" ${i+1===j.jm?"selected":""}>${n}</option>`);
  for(let i=Math.min(yNow-6,j.jy);i<=Math.max(yNow+1,j.jy);i++)y+=`<option value="${i}" ${i===j.jy?"selected":""}>${i}</option>`;
  const t=today(),yd=addDays(t,-1);
  return `<div class="dp" data-field="${field}"><select data-part="d">${d}</select><select data-part="m">${m}</select><select data-part="y">${y}</select></div>
  <div class="chips"><button class="chip ${F.d[field]===t?"on":""}" data-act="f-date" data-v="${t}" data-field="${field}">امروز</button><button class="chip ${F.d[field]===yd?"on":""}" data-act="f-date" data-v="${yd}" data-field="${field}">دیروز</button></div>`}
const fld=(label,inner)=>`<div class="field"><label>${label}</label>${inner}</div>`;

function renderSheet(){if(!F)return;const d=F.d;let title="",body="";
  if(F.type==="txn"){
    title=F.id?"ویرایش تراکنش":"تراکنش جدید";
    const cats=D.cats.filter(c=>c.kind===d.kind).sort((a,b)=>a.order-b.order);
    body=`${seg(d.kind,"f-kind")}
    <div class="field" style="text-align:center"><label>${d.kind==="expense"?"مبلغ برداشت":"مبلغ واریز"}</label>${amountField("amount",true)}<div class="sm b" id="amtHint" style="color:var(--${d.kind==="income"?"inc":"exp"})">${d.amount?compact(d.amount)+" تومان":"تومان"}</div></div>
    ${fld("دسته‌بندی",cats.length?`<div class="chipwrap">${cats.map(c=>`<button class="chip ${d.catId===c.id?"on":""}" style="${d.catId===c.id?`background:${PALETTE[c.color%10]}`:""}" data-act="f-set" data-k="catId" data-v="${c.id}">${c.icon} ${esc(c.name)}</button>`).join("")}</div>`:`<div class="sm muted">دسته‌ای نداری؛ از تنظیمات اضافه کن</div>`)}
    ${fld("کارت بانکی",D.cards.length?`<div class="sugg" style="gap:8px">${D.cards.map(c=>{const g=GRADS[c.color%GRADS.length],on=d.cardId===c.id;return `<button class="chip ${on?"on":""}" style="flex:none;height:52px;padding:0 12px" data-act="f-set" data-k="cardId" data-v="${c.id}"><i style="width:30px;height:20px;border-radius:5px;background:linear-gradient(135deg,${g[0]},${g[1]})"></i><span style="text-align:start"><div class="sm">${esc(c.name||c.bank||"کارت")}</div><div class="xs" style="opacity:.7">${money(cardBal(c))}</div></span></button>`}).join("")}<button class="chip ${!d.cardId?"on":""}" style="flex:none;height:52px" data-act="f-set" data-k="cardId" data-v="">بدون کارت</button></div>`:`<div class="sm muted">هنوز کارتی ثبت نکرده‌ای؛ از داشبورد کارت اضافه کن</div>`)}
    ${fld("تاریخ (شمسی)",datePicker("date"))}
    ${fld("یادداشت",textField("note","مثلاً خرید هفتگی",true))}
    <button class="primary" data-act="f-save" ${d.amount>0?"":"disabled"}>${F.id?"ذخیره تغییرات":"ثبت تراکنش"}</button>${F.id?`<button class="danger" data-act="f-del">حذف تراکنش</button>`:""}`;
  } else if(F.type==="card"){
    title=F.id?"ویرایش کارت":"کارت جدید";
    const c0=F.id?cardOf(F.id):null,preview={...d,bal:d.initial+(c0?cardMove(c0):0)};
    body=`<div id="cardPrev">${bcard(preview,{bal:preview.bal,style:"width:100%;height:190px"})}</div>
    ${fld("رنگ کارت",`<div class="swatches">${GRADS.map((g,i)=>`<button class="sw ${d.color===i?"on":""}" style="background:linear-gradient(135deg,${g[0]},${g[1]})" data-act="f-set" data-k="color" data-v="${i}" data-num="1"></button>`).join("")}</div>`)}
    ${fld("عنوان کارت",textField("name","مثلاً کارت حقوق"))}
    ${fld("بانک",`<select class="sel" data-f="bank"><option value="">انتخاب بانک</option>${BANKS.map(b=>`<option ${d.bank===b?"selected":""}>${b}</option>`).join("")}</select>`)}
    ${fld("شماره کارت (اختیاری)",`<input class="inp" style="direction:ltr;text-align:left;font-size:18px" inputmode="numeric" data-card="number" placeholder="۰۰۰۰ ۰۰۰۰ ۰۰۰۰ ۰۰۰۰" value="${cardNum(d.number,false).includes("•")?"":cardNum(d.number,false)}">`)}
    ${fld(F.id?"موجودی اولیه (تومان)":"موجودی فعلی کارت (تومان)",amountField("initial")+`<div class="xs muted">${F.id?"موجودی فعلی = موجودی اولیه + واریزها − برداشت‌ها":"موجودی الان کارتت رو وارد کن؛ از این به بعد با هر واریز و برداشت خودکار به‌روز می‌شه."}</div>`)}
    <button class="primary" data-act="f-save">${F.id?"ذخیره تغییرات":"افزودن کارت"}</button>${F.id?`<button class="danger" data-act="f-del">حذف کارت</button>`:""}`;
  } else if(F.type==="cat"){
    title=F.id?"ویرایش دسته":"دسته جدید";
    body=`<div class="panel row">${badge(d.icon,PALETTE[d.color],56)}<span class="h2">${esc(d.name)||'<span class="muted">نام دسته</span>'}</span></div>${seg(d.kind,"f-kind")}
    ${fld("نام دسته",textField("name","مثلاً کافه"))}
    ${fld("رنگ",`<div class="swatches">${PALETTE.map((c,i)=>`<button class="sw ${d.color===i?"on":""}" style="background:${c};width:28px;height:28px" data-act="f-set" data-k="color" data-v="${i}" data-num="1"></button>`).join("")}</div>`)}
    ${fld("آیکون",`<div class="emojis">${EMOJIS.map(e=>`<button class="${d.icon===e?"on":""}" data-act="f-set" data-k="icon" data-v="${e}">${e}</button>`).join("")}</div>`)}
    <button class="primary" data-act="f-save" ${d.name.trim()?"":"disabled"}>${F.id?"ذخیره تغییرات":"افزودن دسته"}</button>${F.id?`<button class="danger" data-act="f-del">حذف دسته</button>`:""}`;
  } else if(F.type==="proj"){
    title=F.id?"ویرایش پروژه":"پروژه جدید";
    body=`${fld("نام پروژه",textField("title","مثلاً طراحی سایت فروشگاه"))}${fld("کارفرما (اختیاری)",textField("client","نام شخص یا شرکت"))}
    ${fld("مبلغ دریافتی بابت پروژه (تومان)",amountField("received")+`<div class="sm b" id="amtHint" style="color:var(--lime)">${d.received?compact(d.received)+" تومان":""}</div>`)}
    ${fld("تاریخ (شمسی)",datePicker("date"))}${fld("توضیحات",textField("note","جزئیات قرارداد، شرایط پرداخت و …",true))}
    ${F.id?`<div class="field"><label class="toggle"><span>پروژه تمام شده</span><input type="checkbox" data-chk="done" ${d.done?"checked":""} style="width:22px;height:22px;accent-color:var(--lime)"></label></div>`:""}
    <button class="primary" data-act="f-save" ${d.title.trim()?"":"disabled"}>${F.id?"ذخیره تغییرات":"ساخت پروژه"}</button>`;
  } else if(F.type==="exp"){
    const p=byId(D.projects,d.pid);title=F.id?"ویرایش هزینه":"هزینه جدید";
    const old=F.id?(p.expenses.find(e=>e.id===F.id)||{}).amount||0:0,after=pProfit(p)-(d.amount||0)+old;
    body=`<div class="field" style="text-align:center"><label>مبلغ هزینه · ${esc(p.title)}</label>${amountField("amount",true)}<div class="sm muted">تومان</div></div>
    ${fld("شرح هزینه",textField("title","مثلاً خرید قطعات")+`<div class="sugg">${["خرید مواد","دستمزد","حمل‌ونقل","هاست و دامنه","نرم‌افزار","پیمانکار","اجاره تجهیزات"].map(s=>`<button data-act="f-set" data-k="title" data-v="${s}">${s}</button>`).join("")}</div>`)}
    ${fld("تاریخ (شمسی)",datePicker("date"))}${fld("یادداشت (اختیاری)",textField("note","توضیح بیشتر",true))}
    <div class="field" style="background:var(--limeSoft)"><div class="row"><span class="sm grow" style="font-weight:600">سود پروژه بعد از این هزینه</span><span class="xb" id="afterHint" style="color:var(--${after>=0?"inc":"exp"})">${toman(after)}</span></div></div>
    <button class="primary" data-act="f-save" ${d.amount>0&&d.title.trim()?"":"disabled"}>${F.id?"ذخیره تغییرات":"ثبت هزینه"}</button>${F.id?`<button class="danger" data-act="f-del">حذف این هزینه</button>`:""}`;
  }
  $("#shTitle").textContent=title;
  $("#sheet .shh .iconbtn").innerHTML=ic("x");
  $("#shBody").innerHTML=`<div class="col" style="gap:14px">${body}</div>`;
}
function refreshSaveBtn(){const b=$('#shBody [data-act="f-save"]');if(!b||!F)return;const d=F.d;let ok=true;
  if(F.type==="txn")ok=d.amount>0;else if(F.type==="cat")ok=!!d.name.trim();else if(F.type==="proj")ok=!!d.title.trim();else if(F.type==="exp")ok=d.amount>0&&!!d.title.trim();
  b.disabled=!ok}

function saveForm(){const d=F.d;
  if(F.type==="txn"){if(!(d.amount>0))return;const rec={amount:d.amount,kind:d.kind,date:d.date,note:(d.note||"").trim(),cardId:d.cardId||null,catId:d.catId||null};
    if(F.id)Object.assign(byId(D.txns,F.id),rec);else D.txns.push({id:uid(),created:Date.now(),...rec});toast(F.id?"ذخیره شد":"تراکنش ثبت شد ✓")}
  else if(F.type==="card"){const rec={name:(d.name||"").trim(),bank:d.bank||"",number:digits(d.number||""),initial:d.initial||0,color:d.color||0};
    if(F.id)Object.assign(cardOf(F.id),rec);else D.cards.push({id:uid(),created:Date.now(),...rec});toast("کارت ذخیره شد ✓")}
  else if(F.type==="cat"){const rec={name:d.name.trim(),icon:d.icon,color:d.color,kind:d.kind};if(!rec.name)return;
    if(F.id)Object.assign(cat(F.id),rec);else D.cats.push({id:uid(),order:Math.max(0,...D.cats.map(c=>c.order))+1,...rec})}
  else if(F.type==="proj"){const rec={title:d.title.trim(),client:(d.client||"").trim(),received:d.received||0,date:d.date,note:(d.note||"").trim(),done:!!d.done};if(!rec.title)return;
    if(F.id)Object.assign(byId(D.projects,F.id),rec);else{const p={id:uid(),created:Date.now(),expenses:[],...rec};D.projects.push(p);save();closeSheet();R.stack.push({v:"project",id:p.id});render(true);return}}
  else if(F.type==="exp"){const p=byId(D.projects,d.pid);const rec={title:d.title.trim(),amount:d.amount,date:d.date,note:(d.note||"").trim()};if(!rec.title||!(rec.amount>0))return;
    if(F.id)Object.assign(p.expenses.find(e=>e.id===F.id),rec);else p.expenses.push({id:uid(),created:Date.now(),...rec});toast("هزینه ثبت شد ✓")}
  save();closeSheet();render()}
function deleteForm(){const t=F.type;
  if(t==="txn"){if(!confirm("این تراکنش حذف شود؟"))return;D.txns=D.txns.filter(x=>x.id!==F.id)}
  else if(t==="card"){if(!confirm("کارت حذف شود؟ تراکنش‌هایش باقی می‌مانند ولی به کارتی وصل نیستند."))return;D.cards=D.cards.filter(x=>x.id!==F.id);D.txns.forEach(x=>{if(x.cardId===F.id)x.cardId=null});R.stack=R.stack.filter(s=>!(s.v==="card"&&s.id===F.id))}
  else if(t==="cat"){if(!confirm("دسته حذف شود؟ تراکنش‌هایش «بدون دسته» می‌شوند."))return;D.cats=D.cats.filter(x=>x.id!==F.id);D.txns.forEach(x=>{if(x.catId===F.id)x.catId=null})}
  else if(t==="exp"){if(!confirm("این هزینه حذف شود؟"))return;const p=byId(D.projects,F.d.pid);p.expenses=p.expenses.filter(e=>e.id!==F.id)}
  save();closeSheet();render()}

/* ---------- Print / PDF ---------- */
function printProject(id){const p=byId(D.projects,id);const e=pExp(p),pr=p.received-e;
  $("#print").innerHTML=`<div style="font-family:Vaz;direction:rtl;color:#101410">
  <div class="row" style="gap:14px"><img src="${LOGO}" style="width:60px;height:60px;border-radius:16px;object-fit:cover"><div class="grow"><div class="xb" style="font-size:24px">Pantera</div><div class="sm muted">صورت‌حساب پروژه</div></div><div style="text-align:end"><div class="xs muted">تاریخ صدور</div><div class="b">${jLong(today())}</div></div></div>
  <hr style="border:0;border-top:1px solid #E6EAE5;margin:18px 0">
  <div class="col" style="gap:6px;margin-bottom:18px"><div><span class="muted sm">پروژه: </span><b>${esc(p.title)}</b></div>${p.client?`<div><span class="muted sm">کارفرما: </span><b>${esc(p.client)}</b></div>`:""}<div><span class="muted sm">تاریخ پروژه: </span><b>${jLong(p.date)}</b></div><div><span class="muted sm">وضعیت: </span><b>${p.done?"تمام‌شده":"در جریان"}</b></div></div>
  ${expTable(p,true)}
  <div style="background:#E4F6D8;border-radius:16px;padding:16px;margin-top:18px;-webkit-print-color-adjust:exact;print-color-adjust:exact" class="col">
  <div class="row"><span class="grow">مبلغ دریافتی</span><b>${toman(p.received)}</b></div><div class="row"><span class="grow">مجموع هزینه‌ها</span><b class="exp">${toman(e)}</b></div>
  <div class="row" style="border-top:1px solid #cfe3c2;padding-top:10px"><span class="grow xb" style="font-size:16px">سود نهایی</span><b class="xb" style="font-size:20px;color:${pr>=0?"#2FA84F":"#E5484D"}">${toman(pr)}</b></div>
  <div class="row sm"><span class="grow muted">حاشیه سود</span><b>${pct(pMargin(p))}</b></div></div>
  ${p.note?`<p class="sm muted">${esc(p.note)}</p>`:""}<p class="xs muted" style="text-align:center;margin-top:24px">تهیه‌شده با Pantera</p></div>`;
  setTimeout(()=>window.print(),60)}

/* ---------- Backup ---------- */
async function exportData(){const name="Pantera-backup-"+jShort(today()).replace(/\//g,"-")+".json";const blob=new Blob([JSON.stringify(D,null,1)],{type:"application/json"});
  try{const file=new File([blob],name,{type:"application/json"});if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:"پشتیبان Pantera"});return}}catch(e){if(e&&e.name==="AbortError")return}
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();toast("فایل پشتیبان ذخیره شد")}
$("#importFile").addEventListener("change",async e=>{const f=e.target.files[0];e.target.value="";if(!f)return;
  try{const d=JSON.parse(await f.text());if(!d||!Array.isArray(d.cats)||!Array.isArray(d.txns))throw 0;
    if(!confirm("اطلاعات فعلی با فایل پشتیبان جایگزین شود؟"))return;D={cards:d.cards||[],cats:d.cats,txns:d.txns,projects:d.projects||[]};save();R.stack=[];R.tab="home";render(true);toast("اطلاعات بازگردانی شد ✓")}
  catch(err){alert("این فایل، پشتیبان معتبر Pantera نیست.")}});

/* ---------- Events ---------- */
const A={
  tab:el=>{R.tab=el.dataset.t;R.stack=[];render(true)},
  go:el=>{R.stack.push({v:el.dataset.v,id:el.dataset.id});render(true)},
  back:()=>{R.stack.pop();render(true)},
  "m-prev":()=>{R.month=mAdd(R.month,-1);render()},"m-next":()=>{R.month=mAdd(R.month,1);render()},"m-cur":()=>{R.month=curMonth();render()},
  filter:el=>{R.filter=el.dataset.f;render()},
  "stat-kind":el=>{R.statKind=el.dataset.k;render()},
  "cat-kind":el=>{R.catKind=el.dataset.k;render()},
  pfilter:el=>{R.pFilter=el.dataset.f;render()},
  add:()=>openSheet("txn",null,{kind:"expense",amount:0,catId:null,cardId:D.cards[0]?D.cards[0].id:null,date:today(),note:""}),
  "txn-edit":el=>{const t=byId(D.txns,el.dataset.id);openSheet("txn",t.id,{...t})},
  "card-new":()=>openSheet("card",null,{name:"",bank:"",number:"",initial:0,color:0}),
  "card-edit":el=>{const c=cardOf(el.dataset.id);openSheet("card",c.id,{...c})},
  "cat-new":()=>openSheet("cat",null,{name:"",icon:"🏷️",color:0,kind:R.catKind}),
  "cat-edit":el=>{const c=cat(el.dataset.id);openSheet("cat",c.id,{...c})},
  "proj-new":()=>openSheet("proj",null,{title:"",client:"",received:0,date:today(),note:"",done:false}),
  "proj-edit":el=>{const p=byId(D.projects,el.dataset.id);openSheet("proj",p.id,{...p})},
  "proj-done":el=>{const p=byId(D.projects,el.dataset.id);p.done=!p.done;save();render();toast(p.done?"پروژه تمام شد ✓":"به «در جریان» برگشت")},
  "proj-del":el=>{if(!confirm("پروژه و همه هزینه‌هایش حذف شود؟"))return;D.projects=D.projects.filter(p=>p.id!==el.dataset.id);save();R.stack.pop();render(true)},
  "exp-new":el=>openSheet("exp",null,{pid:el.dataset.pid,title:"",amount:0,date:today(),note:""}),
  "exp-edit":el=>{const p=byId(D.projects,el.dataset.pid),e=p.expenses.find(x=>x.id===el.dataset.id);openSheet("exp",e.id,{...e,pid:p.id})},
  print:el=>printProject(el.dataset.id),
  export:()=>exportData(),
  import:()=>$("#importFile").click(),
  reset:()=>{if(!confirm("همه اطلاعات (کارت‌ها، تراکنش‌ها، پروژه‌ها) پاک شود؟ این کار برگشت‌پذیر نیست."))return;if(!confirm("مطمئنی؟ بهتره اول فایل پشتیبان بگیری."))return;try{localStorage.removeItem(KEY)}catch(e){}memStore=null;D=load();save();R.stack=[];R.tab="home";render(true)},
  "sheet-close":()=>closeSheet(),
  "f-kind":el=>{F.d.kind=el.dataset.k;if(F.type==="txn"){const c=cat(F.d.catId);if(c&&c.kind!==F.d.kind)F.d.catId=null}renderSheet()},
  "f-set":el=>{let v=el.dataset.v;if(el.dataset.num)v=+v;F.d[el.dataset.k]=v===""?null:v;renderSheet()},
  "f-date":el=>{F.d[el.dataset.field]=el.dataset.v;renderSheet()},
  "f-save":()=>saveForm(),
  "f-del":()=>deleteForm()
};
document.addEventListener("click",e=>{const el=e.target.closest("[data-act]");if(!el)return;const f=A[el.dataset.act];if(f){e.preventDefault();f(el)}});
document.addEventListener("input",e=>{const t=e.target;
  if(t.id==="q"){R.search=t.value;$("#txlist").innerHTML=txList();return}
  if(!F)return;
  if(t.dataset.amt){const k=t.dataset.amt,dg=digits(t.value).slice(0,15),v=dg?+dg:0;F.d[k]=v;const f=dg?money(v):"";if(t.value!==f)t.value=f;
    const h=$("#amtHint");if(h)h.textContent=v?compact(v)+" تومان":(F.type==="txn"?"تومان":"");
    const ah=$("#afterHint");if(ah&&F.type==="exp"){const p=byId(D.projects,F.d.pid),old=F.id?(p.expenses.find(x=>x.id===F.id)||{}).amount||0:0,a=pProfit(p)-v+old;ah.textContent=toman(a);ah.style.color=a>=0?"var(--inc)":"var(--exp)"}}
  else if(t.dataset.f){F.d[t.dataset.f]=t.value}
  else if(t.dataset.card){const dg=digits(t.value).slice(0,16);F.d.number=dg;const f=dg.match(/.{1,4}/g);const s=f?f.join(" "):"";if(t.value!==s)t.value=s}
  cardPreview();refreshSaveBtn()});
document.addEventListener("change",e=>{const t=e.target;if(!F)return;
  const dp=t.closest(".dp");if(dp){const g=p=>+dp.querySelector(`[data-part="${p}"]`).value;const y=g("y"),m=g("m"),d=Math.min(g("d"),monthLen(y,m));F.d[dp.dataset.field]=toG(y,m,d);renderSheet();return}
  if(t.dataset.chk){F.d[t.dataset.chk]=t.checked}
});
function cardPreview(){const el=$("#cardPrev");if(!el||!F||F.type!=="card")return;const c0=F.id?cardOf(F.id):null;el.innerHTML=bcard(F.d,{bal:(F.d.initial||0)+(c0?cardMove(c0):0),style:"width:100%;height:190px"})}

/* ---------- Boot ---------- */
render(true);
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
if("serviceWorker" in navigator&&/^https?:$/.test(location.protocol)){navigator.serviceWorker.register("sw.js").catch(()=>{})}
</script>
</body>
</html>
